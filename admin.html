function hashPin(p) {
  var h = 5381, s = "ysalt" + p + "ysalt";
  for (var i = 0; i < s.length; i++) h = ((h << 5) + h) + s.charCodeAt(i);
  return "h" + (h >>> 0).toString(36);
}

function resizeImage(file, maxSize) {
  return new Promise(function(resolve, reject) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onload = function() {
        var w = img.width, h = img.height;
        if (w > h) { if (w > maxSize) { h = Math.round(h * maxSize / w); w = maxSize; } }
        else { if (h > maxSize) { w = Math.round(w * maxSize / h); h = maxSize; } }
        var c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL("image/jpeg", 0.7));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function fmtTime(t) {
  if (!t) return "--";
  var p = t.split(":");
  var hh = parseInt(p[0], 10);
  var ap = hh >= 12 ? "PM" : "AM";
  var h12 = hh % 12 || 12;
  return h12 + ":" + p[1] + " " + ap;
}

function syncTable(table, newArr, oldArr, denorm) {
  if (!sb) return;
  var oldMap = {};
  oldArr.forEach(function(x) { oldMap[x.id] = x; });
  var toUpsert = newArr.filter(function(x) {
    var o = oldMap[x.id];
    return !o || JSON.stringify(o) !== JSON.stringify(x);
  }).map(denorm);
  var newIds = {};
  newArr.forEach(function(x) { newIds[x.id] = true; });
  var toDel = oldArr.filter(function(x) { return !newIds[x.id]; }).map(function(x) { return x.id; });
  if (toUpsert.length) {
    sb.from(table).upsert(toUpsert).then(function(res) { if (res.error) console.error(res.error); }).catch(function(e) { console.error(e); });
  }
  if (toDel.length) {
    sb.from(table).delete().in("id", toDel).then(function(res) { if (res.error) console.error(res.error); }).catch(function(e) { console.error(e); });
  }
}

}

      REQ = cached.REQ || [];

    }

  return Promise.all([
    sb.from("customers").select("*"),

}

function saveS(a) { var old = SESS; SESS = a; syncTable("sessions", a, old, denormS); }
function getSess(id) { return SESS.find(function(s) { return s.id === id; }); }
function upsertS(s) {
  var a = SESS.slice();
  var i = a.findIndex(function(x) { return x.id === s.id; });
  if (i >= 0) a[i] = s; else a.unshift(s);

window.aAdd = function(sid) {
  var s = getSess(sid);

  var name = prompt("Item name?", "Water");

    var s2 = getSess(sid);

    if (s2.customerId) {
      var c = CUST.find(function(x) { return x.id === s2.customerId; });
      if (c) {
        var e = Math.floor(price / RR);
        c.points = Math.min(POINTS_MAX, (c.points || 0) + e);
        c.pointsSpent = (c.pointsSpent || 0) + e;
        c.totalSpent += price;
        c.lastActivity = Date.now();
        var arr = CUST.slice();
        var i = arr.findIndex(function(x) { return x.id === c.id; });
        if (i >= 0) arr[i] = c;
        saveC(arr);
      }
    }
    alert("✅ Added ₹" + price);
    render("station", { id: s2.stationId });
  });
};

window.aExt = function(sid) {
  var s = getSess(sid);
  if (!s) return;
  var e = EXP.find(function(x) { return x.id === s.expId; });
  if (e && e.fixed) return alert("Can't extend");
  var add = parseInt(prompt("Add minutes?", "30"));
  if (!add) return;
  var rate = 0;
  if (e && e.prices && e.prices[add]) rate = e.prices[add];
  else rate = parseInt(prompt("Rate ₹?", "100")) || 0;
  var pl = parseInt(prompt("Players?", s.players)) || s.players;
  var amt = rate * pl;
  loadAll().then(function() {
    var s2 = getSess(sid);
    if (!s2) return;
    var base = Math.max(Date.now(), s2.end || Date.now());
    s2.end = base + add * 60000;
    s2.minutes = (s2.minutes || 0) + add;
    s2.total += amt;
    upsertS(s2);
    if (s2.customerId) {
      var c = CUST.find(function(x) { return x.id === s2.customerId; });
      if (c) {
        var e2 = Math.floor(amt / RR);
        c.points = Math.min(POINTS_MAX, (c.points || 0) + e2);
        c.pointsSpent = (c.pointsSpent || 0) + e2;
        c.totalSpent += amt;
        c.lastActivity = Date.now();
        var arr = CUST.slice();
        var i = arr.findIndex(function(x) { return x.id === c.id; });
        if (i >= 0) arr[i] = c;
        saveC(arr);
      }
    }
    alert("✅ +" + add + "min · Collect ₹" + amt);
    render("station", { id: s2.stationId });
  });
};

window.aEnd = function(sid) {
  var s = getSess(sid);
  if (!s) return;
  loadAll().then(function() {
    var s2 = getSess(sid);
    if (!s2) return;
    var c = s2.customerId ? CUST.find(function(x) { return x.id === s2.customerId; }) : null;
    var played = Math.max(0, Math.floor((Date.now() - (s2.start || Date.now())) / 60000));
    if (s2.isMembership && c) {
      var hrs = Math.max(0.25, Math.ceil(played / 15) / 4);
      var isRace = s2.expId === "racing";
      if (isRace) { c.raceHours = Math.max(0, (c.raceHours || 0) - hrs); }
      else { c.ps5Hours = Math.max(0, (c.ps5Hours || 0) - hrs); }
      c.lastActivity = Date.now();
      var arr = CUST.slice();
      var i = arr.findIndex(function(x) { return x.id === c.id; });
      if (i >= 0) arr[i] = c;
      saveC(arr);
      if (!confirm("Stop session?\n\nPlayed: " + played + " min\nDeducting: " + hrs.toFixed(2) + "h\n\nConfirm?")) return;
    } else {

window.collect = function(sid) {
  var s = getSess(sid);
  if (!s) return;
  var c = s.customerId ? CUST.find(function(x) { return x.id === s.customerId; }) : null;
  var method = prompt("Payment method?\n\ncash / upi / points\n\nAmount: ₹" + s.total + (c ? "\nCustomer points: " + c.points : ""), "cash");
  if (!method) return;
  var m = method.toLowerCase().trim();
  var usePoints = false;
  if (m === "points") {
    if (!c) return alert("No customer");
    if (c.points < s.total) return alert("Not enough points");
    if (!confirm("Use " + s.total + " points?")) return;
    usePoints = true;
  }
  loadAll().then(function() {
    var s2 = getSess(sid);
    if (!s2) return;
    if (usePoints && c) {
      c.points = c.points - s2.total;
      c.lastActivity = Date.now();
      var arr = CUST.slice();
      var i = arr.findIndex(function(x) { return x.id === c.id; });
      if (i >= 0) arr[i] = c;
      saveC(arr);
      s2.method = "points";
    } else {
      s2.method = (m === "upi") ? "upi" : "cash";
    }
    s2.paid = true;
    upsertS(s2);
    if (!usePoints && s2.customerId) {
      var c2 = CUST.find(function(x) { return x.id === s2.customerId; });
      if (c2) {
        var earned = Math.floor(s2.total / RR);
        c2.points = Math.min(POINTS_MAX, (c2.points || 0) + earned);
        c2.pointsSpent = (c2.pointsSpent || 0) + earned;
        c2.totalSpent += s2.total;
        c2.visits += 1;
        c2.lastActivity = Date.now();
        s2.pointsEarned = earned;
        var arr2 = CUST.slice();
        var i2 = arr2.findIndex(function(x) { return x.id === c2.id; });
        if (i2 >= 0) arr2[i2] = c2;
        saveC(arr2);
        upsertS(s2);
      }
    }
    var exp = EXP.find(function(x) { return x.id === s2.expId; });
    if (exp && exp.fixed && c) {
      var isRace = exp.id === "racemem";
      var hrs = parseInt(prompt("Credit how many " + (isRace ? "Racing" : "PS5") + " hours?", "30")) || 0;
      if (hrs > 0) {
        if (isRace) { c.raceHours = (c.raceHours || 0) + hrs; }
        else { c.ps5Hours = (c.ps5Hours || 0) + hrs; }
        var arr3 = CUST.slice();
        var i3 = arr3.findIndex(function(x) { return x.id === c.id; });
        if (i3 >= 0) arr3[i3] = c;
        saveC(arr3);
        alert("✅ " + hrs + "h credited");
      }
    }
    if (!s2.stationId && s2.expId !== "snacks" && !s2.isMembership) {
      var now = Date.now();
      var busy = SESS.filter(function(x) { return x.status === "playing" && x.stationId && x.id !== s2.id; }).map(function(x) { return x.stationId; });
      var free = STA.filter(function(st) { return busy.indexOf(st.id) < 0; });
      if (free.length) {
        var isRace2 = s2.expId === "racing";
        var pool = free.filter(function(st) { return isRace2 ? st.id.indexOf("race") >= 0 : st.id.indexOf("ps5") >= 0; });
        if (!pool.length) pool = free;
        var station = pool[Math.floor(Math.random() * pool.length)];
        s2.stationId = station.id;
        s2.status = "playing";
        s2.start = now;
        s2.end = now + (s2.minutes || 60) * 60000;
        upsertS(s2);
        alert("✅ Collected ₹" + s2.total + "\n\n📍 " + station.name);
      } else {
        s2.status = "paid";
        upsertS(s2);
        alert("✅ Collected ₹" + s2.total + "\n\n⚠ All stations busy");
      }
    } else {
      alert("✅ Collected ₹" + s2.total);
    }
    render("payments", {});
  });
};

window.approveReq = function(rid) {
  var r = REQ.find(function(x) { return x.id === rid; });
  if (!r) return;
  loadAll().then(function() {
    var r2 = REQ.find(function(x) { return x.id === rid; });

      var method = "cash";

        var arr = CUST.slice();
        var i = arr.findIndex(function(x) { return x.id === c.id; });
        if (i >= 0) arr[i] = c;

  if (bk.time && !e.fixed && !isMem) items.push(bk.time + "min × " + bk.players + "p");
  var total = 0;
  if (e.fixed) total = e.fixed;
  else if (bk.time) {
    var b = e.prices[bk.time] * bk.players;
    if (e.id === "racing") total = b;
    else if (bk.time === 30 || bk.time === 180) total = b;
    else if (bk.players >= 5) total = b * 0.90;
    else if (bk.players >= 3) total = b * 0.95;
    else total = b;
  }
  var s = { id: newBID(), name: n, phone: "", expId: e.id, expName: e.name, items: items,
    total: Math.round(total), minutes: isMem ? 1800 : (bk.time || 60), players: bk.players,

    customerId: null, isMembership: isMem };

      '<div class="grid3" style="padding-top:12px;border-top:1px solid var(--border)">' +
        '<div><div style="font-size:10px;color:var(--muted);font-weight:700">PLAYERS</div><div style="font-weight:800;color:var(--cyan);margin-top:4px">' + players.length + '/' + (t.maxPlayers || 16) + '</div></div>' +
        '<div><div style="font-size:10px;color:var(--muted);font-weight:700">PAID</div><div style="font-weight:800;color:var(--cyan);margin-top:4px">' + paid + '</div></div>' +
        '<div><div style="font-size:10px;color:var(--muted);font-weight:700">₹</div><div style="font-weight:800;color:var(--gold-bright);margin-top:4px">' + col + '</div></div>' +
      '</div></div>';
  }).join("") : '<div class="empty"><div class="big">🏆</div><div class="msg">NONE</div></div>';
  return '<div class="screen"><div class="wrap">' +
    '<a href="javascript:go(\'more\')" style="color:var(--muted);font-size:13px">← More</a>' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px;margin-bottom:16px">' +
      '<div><h1 style="margin:0;font-size:22px">Tournaments</h1><p class="sub" style="margin:4px 0 0">' + TOURN.length + ' events</p></div>' +
      '<button class="btn sm" onclick="createTourney()">+ New</button>' +
    '</div>' + cards +
  '</div></div>';
};

window.updatePrizes = function(n) {
  ["2", "3", "4"].forEach(function(i) {
    var w = document.getElementById("ctp" + i + "w");
    if (w) w.style.display = n >= +i ? "" : "none";
  });
};

window.saveTourney = function() {
  var n = document.getElementById("ctn").value.trim();
  var g = document.getElementById("ctg").value.trim();
  var d = document.getElementById("ctd").value;
  var t = document.getElementById("ctt").value;
  if (!n || !g || !d || !t) return alert("Fill fields");
  var tourney = { id: newTID(), name: n, game: g, date: d, time: t,
    entryFee: parseInt(document.getElementById("ctf").value) || 0,
    maxPlayers: parseInt(document.getElementById("ctm2").value),
    winnersCount: parseInt(document.getElementById("ctw").value) || 3,
    banner: document.getElementById("ctb").value.trim() || "🏆",
    bannerPic: document.getElementById("ctpic").value.trim() || "",
    prize1: document.getElementById("ctp1").value.trim(),
    prize2: document.getElementById("ctp2") ? document.getElementById("ctp2").value.trim() : "",
    prize3: document.getElementById("ctp3") ? document.getElementById("ctp3").value.trim() : "",
    prize4: document.getElementById("ctp4") ? document.getElementById("ctp4").value.trim() : "",
    rules: document.getElementById("ctr").value.trim(),
    status: "open", players: [], bracket: [], winners: [], winner: null, createdAt: Date.now() };
  loadAll().then(function() {
    var arr = [tourney].concat(TOURN);
    var old = TOURN;
    TOURN = arr;
    syncTable("tournaments", arr, old, denormT);
    document.getElementById("ctm").remove();
    alert("✅ Created");

};

R.tdetail = function(p) {
  var t = getTid(p.id);
  if (!t) return '<div class="screen"><div class="wrap"><h2>Not found</h2></div></div>';
  var players = t.players || [];
  var paid = players.filter(function(x) { return x.paid; }).length;
  var col = players.filter(function(x) { return x.paid; }).reduce(function(s, x) { return s + t.entryFee; }, 0);
  var playerHTML = players.length ? players.map(function(pl) {
    return '<div style="display:flex;align-items:center;gap:12px;padding:12px;background:var(--card2);border:1px solid var(--border);border-radius:8px;margin-bottom:8px">' +
      '<div style="background:var(--gold);color:#111;padding:6px 14px;border-radius:8px;font-weight:800;font-size:15px;font-family:\'Courier New\',monospace;min-width:60px;text-align:center">' + pl.id + '</div>' +
      '<div style="flex:1"><div style="font-weight:700">' + pl.name + '</div></div>' +
      '<div style="display:flex;gap:6px">' + (pl.paid ? '<span class="badge open">PAID</span>' : '<button class="btn xs" onclick="markPaid(\'' + t.id + '\',\'' + pl.id + '\')">Collect</button>') +
      '<button class="btn danger xs" onclick="removePlayer(\'' + t.id + '\',\'' + pl.id + '\')">✕</button></div></div>';
  }).join("") : '<div class="notice">No players yet</div>';
  return '<div class="screen"><div class="wrap">' +
    '<a href="javascript:go(\'tourneys\')" style="color:var(--muted);font-size:13px">← Tournaments</a>' +
    (t.bannerPic ? '<img src="' + t.bannerPic + '" style="width:100%;height:140px;object-fit:cover;border-radius:10px;margin:14px 0">' : "") +
    '<h1 style="margin-top:' + (t.bannerPic ? "0" : "20px") + '">' + t.name + '</h1><p class="sub">' + t.game + ' · ' + fmtTime(t.time) + '</p>' +
    '<div class="grid3" style="margin-bottom:16px">' +
      '<div class="stat-box cyan"><div class="lbl">Players</div><div class="val">' + players.length + '/' + (t.maxPlayers || 16) + '</div></div>' +
      '<div class="stat-box gold"><div class="lbl">Paid</div><div class="val">' + paid + '</div></div>' +
      '<div class="stat-box pink"><div class="lbl">₹</div><div class="val">₹' + col + '</div></div>' +
    '</div>' +
    '<div class="sec-label">Players</div>' + playerHTML +
    '<div class="sec-label">Actions</div>' +
    (t.status === "open" && players.length >= 2 ? '<button class="btn pink" onclick="startTourney(\'' + t.id + '\')">🚀 Start</button>' : "") +
    (t.status === "live" ? '<button class="btn dark" style="margin-top:8px" onclick="go(\'tbracket\',{id:\'' + t.id + '\'})">Manage Bracket</button>' : "") +
    (t.status === "open" ? '<button class="btn danger" style="margin-top:8px" onclick="deleteTourney(\'' + t.id + '\')">Delete</button>' : "") +
  '</div></div>';
};

window.markPaid = function(tid, pid) {
  loadAll().then(function() {
    var t = getTid(tid);
    if (!t) return;
    var pl = t.players.find(function(x) { return x.id === pid; });
    if (!pl) return;
    pl.paid = true;
    upsertT(t);
    alert("✅ ₹" + t.entryFee + " collected");
    render("tdetail", { id: tid });
  });
};

window.removePlayer = function(tid, pid) {
  loadAll().then(function() {
    var t = getTid(tid);
    if (!t) return;
    if (!confirm("Remove?")) return;
    t.players = t.players.filter(function(x) { return x.id !== pid; });
    upsertT(t);
    render("tdetail", { id: tid });
  });
};

window.deleteTourney = function(tid) {
  if (!confirm("Delete?")) return;
  loadAll().then(function() {
    saveT(TOURN.filter(function(t) { return t.id !== tid; }));
    go("tourneys");
  });
};

window.startTourney = function(tid) {
  loadAll().then(function() {
    var t = getTid(tid);
    if (!t) return;
    var pl = t.players || [];
    if (pl.length < 2) return alert("Need 2+");
    var sh = pl.slice().sort(function() { return Math.random() - 0.5; });
    var size = 1;
    while (size < sh.length) size *= 2;
    while (sh.length < size) sh.push(null);
    var br = [], r1 = [];
    for (var i = 0; i < sh.length; i += 2) {
      var m = { id: "M" + (br.length + 1), p1: sh[i] ? sh[i].name : null, p2: sh[i+1] ? sh[i+1].name : null,
        p1id: sh[i] ? sh[i].id : null, p2id: sh[i+1] ? sh[i+1].id : null,
        winner: null, round: 1, nextMatch: null, nextSlot: null };
      br.push(m); r1.push(m);
    }
    var cur = r1, rn = 2;
    while (cur.length > 1) {
      var nr = [];
      for (var j = 0; j < cur.length; j += 2) {
        var mm = { id: "M" + (br.length + 1), p1: null, p2: null, p1id: null, p2id: null, winner: null, round: rn, nextMatch: null, nextSlot: null };
        cur[j].nextMatch = mm.id; cur[j].nextSlot = "p1";
        if (cur[j+1]) { cur[j+1].nextMatch = mm.id; cur[j+1].nextSlot = "p2"; }
        else { mm.p2 = "BYE"; mm.winner = mm.p1; }
        br.push(mm); nr.push(mm);
      }
      cur = nr; rn++;
    }
    t.bracket = br;
    t.status = "live";
    upsertT(t);
    alert("🚀 Started");
    go("tbracket", { id: tid });
  });
};

R.tbracket = function(p) {
  var t = getTid(p.id);
  if (!t) return '<div class="screen"><div class="wrap"><h2>Not found</h2></div></div>';
  var bracket = t.bracket || [];
  var rounds = {};
  bracket.forEach(function(m) { if (!rounds[m.round]) rounds[m.round] = []; rounds[m.round].push(m); });
  var done = bracket.length > 0 && bracket.every(function(m) { return m.winner; });
  var html = Object.keys(rounds).sort(function(a, b) { return +a - +b; }).map(function(r) {
    return '<div class="sec-label">ROUND ' + r + '</div>' + rounds[r].map(function(m) {
      return '<div class="card" style="padding:14px;border-left:4px solid ' + (m.winner ? "var(--cyan)" : "var(--gold)") + '">' +
        '<div style="font-size:10px;color:var(--muted);font-weight:700;margin-bottom:10px">MATCH ' + m.id + '</div>' +
        '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px;border-radius:8px;background:' + (m.winner === m.p1 ? "#0c2a1a" : "transparent") + '">' +
          '<div style="font-weight:700">' + (m.p1 || "TBD") + (m.winner === m.p1 ? " 🏆" : "") + '</div>' +
          (m.p1 && m.p2 && !m.winner ? '<button class="btn xs" onclick="setWin(\'' + t.id + '\',\'' + m.id + '\',\'p1\')">Wins →</button>' : "") + '</div>' +
        '<div style="text-align:center;color:var(--muted);padding:4px 0">VS</div>' +
        '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px;border-radius:8px;background:' + (m.winner === m.p2 ? "#0c2a1a" : "transparent") + '">' +
          '<div style="font-weight:700">' + (m.p2 || "TBD") + (m.winner === m.p2 ? " 🏆" : "") + '</div>' +
          (m.p1 && m.p2 && !m.winner ? '<button class="btn xs" onclick="setWin(\'' + t.id + '\',\'' + m.id + '\',\'p2\')">Wins →</button>' : "") + '</div>' +
      '</div>';
    }).join("");
  }).join("");
  return '<div class="screen"><div class="wrap">' +
    '<a href="javascript:go(\'tdetail\',{id:\'' + t.id + '\'})" style="color:var(--muted);font-size:13px">← Back</a>' +
    '<h1 style="margin-top:20px">' + t.name + '</h1><p class="sub">Tap winner</p>' +
    html +
    (done ? '<div class="notice gold" style="margin-top:20px;text-align:center">🏆 Done!<button class="btn" style="margin-top:12px;width:100%" onclick="declareWinners(\'' + t.id + '\')">Declare Winners</button></div>' : "") +
  '</div></div>';
};

window.setWin = function(tid, mid, side) {
  loadAll().then(function() {
    var t = getTid(tid);
    if (!t) return;
    var m = t.bracket.find(function(x) { return x.id === mid; });
    if (!m) return;
    var w = side === "p1" ? m.p1 : m.p2;
    m.winner = w;
    if (m.nextMatch) {
      var n = t.bracket.find(function(x) { return x.id === m.nextMatch; });
      if (n) { if (m.nextSlot === "p1") n.p1 = w; else n.p2 = w; }
    }
    upsertT(t);
    render("tbracket", { id: tid });
  });
};

window.declareWinners = function(tid) {
  loadAll().then(function() {
    var t = getTid(tid);
    if (!t) return;
    var ws = t.bracket.map(function(m) { return m.winner; }).filter(function(x) { return x; });
    var cnt = t.winnersCount || 3;
    var winners = [];
    var uniq = ws.filter(function(v, i, a) { return a.indexOf(v) === i; });
    for (var i = 1; i <= cnt; i++) {
      var place = i === 1 ? "🥇 1st" : i === 2 ? "🥈 2nd" : i === 3 ? "🥉 3rd" : i + "th";
      var n = prompt("Enter " + place + ":\n\nAvailable: " + uniq.join(", "));
      if (!n) break;
      winners.push({ place: i, name: n.trim() });
    }
    if (!winners.length) return;
    t.winners = winners;
    t.winner = winners[0].name;
    t.status = "done";
    upsertT(t);
    alert("🏆 Saved");
    go("tourneys");
  });
};

R.reports = function() {
  if (!can("reports")) return R.denied();
  var all = SESS;
  var gc = {}, ic = {};
  all.forEach(function(s) {
    if (s.expName) gc[s.expName] = (gc[s.expName] || 0) + 1;
    (s.items || []).forEach(function(it) {
      if (it.match(/min|member|PS5|Racing|Membership/i)) return;
      ic[it] = (ic[it] || 0) + 1;
    });
  });
  var tg = Object.keys(gc).map(function(k) { return [k, gc[k]]; }).sort(function(a, b) { return b[1] - a[1]; }).slice(0, 5);
  var ti = Object.keys(ic).map(function(k) { return [k, ic[k]]; }).sort(function(a, b) { return b[1] - a[1]; }).slice(0, 8);
  var tr = all.reduce(function(t, s) { return t + (s.paid ? s.total : 0); }, 0);
  var tm = all.reduce(function(t, s) { return t + (s.minutes || 0); }, 0);
  var cash = all.filter(function(s) { return s.paid && s.method === "cash"; }).reduce(function(t, s) { return t + s.total; }, 0);
  var upi = all.filter(function(s) { return s.paid && s.method === "upi"; }).reduce(function(t, s) { return t + s.total; }, 0);
  var pts = all.filter(function(s) { return s.paid && s.method === "points"; }).reduce(function(t, s) { return t + s.total; }, 0);
  return '<div class="screen"><div class="wrap">' +
    '<a href="javascript:go(\'more\')" style="color:var(--muted);font-size:13px">← More</a>' +
    '<h1 style="margin-top:20px">Reports</h1>' +
    '<div class="grid4">' +
      '<div class="stat-box gold"><div class="lbl">Revenue</div><div class="val">₹' + tr + '</div></div>' +
      '<div class="stat-box cyan"><div class="lbl">Hours</div><div class="val">' + (tm / 60).toFixed(1) + 'h</div></div>' +
      '<div class="stat-box green"><div class="lbl">Cash</div><div class="val">₹' + cash + '</div></div>' +
      '<div class="stat-box pink"><div class="lbl">UPI</div><div class="val">₹' + upi + '</div></div>' +
    '</div>' +
    '<div class="sec-label">🏆 Top Games</div>' +
    (tg.length ? tg.map(function(item, i) { return '<div class="card" style="padding:12px;display:flex;justify-content:space-between"><div><b style="color:var(--gold-bright)">#' + (i + 1) + '</b> ' + item[0] + '</div><div style="font-weight:800;color:var(--cyan)">' + item[1] + '×</div></div>'; }).join("") : '<div class="notice">No data</div>') +
    '<div class="sec-label">🍟 Best Snacks</div>' +
    (ti.length ? ti.map(function(item, i) { return '<div class="card" style="padding:12px;display:flex;justify-content:space-between"><div><b style="color:var(--gold-bright)">#' + (i + 1) + '</b> ' + item[0] + '</div><div style="font-weight:800;color:var(--pink)">' + item[1] + '×</div></div>'; }).join("") : '<div class="notice">No data</div>') +
  '</div></div>';
};
