<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pay Bill · Yondu</title>
<link rel="stylesheet" href="style.css">
<style>
.bill-row{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);font-size:14px}
.bill-row:last-child{border-bottom:0}
.bill-row .lbl{color:var(--txt2)}
.bill-row .val{font-weight:600;color:var(--txt)}
.pay-method{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.pay-btn{display:flex;align-items:center;gap:14px;padding:18px;background:linear-gradient(160deg,var(--card),var(--bg2));border:1.5px solid var(--line);border-radius:14px;cursor:pointer;transition:all .2s;text-align:left;font-family:inherit;color:var(--txt);width:100%}
.pay-btn:hover{border-color:var(--line2);transform:translateY(-2px)}
.pay-btn.on{border-color:var(--gold2);background:linear-gradient(160deg,rgba(232,207,139,.12),var(--card));box-shadow:0 0 0 1px rgba(232,207,139,.25),0 0 30px rgba(232,207,139,.15)}
.pay-btn .ic{font-size:28px;flex-shrink:0}
.pay-btn .info{flex:1}
.pay-btn .t{font-weight:700;font-size:15px;color:var(--txt)}
.pay-btn .d{font-size:12px;color:var(--txt3);margin-top:3px;font-weight:500}
.pay-btn .check{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:transparent}
.pay-btn.on .check{background:var(--gold);border-color:var(--gold);color:#1a1408}
.status-live{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:100px;background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);color:var(--green);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.status-live .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.5s infinite}
.status-pending{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:100px;background:rgba(251,146,60,.15);border:1px solid rgba(251,146,60,.3);color:var(--orange);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.status-pending .dot{width:6px;height:6px;border-radius:50%;background:var(--orange);box-shadow:0 0 8px var(--orange);animation:pulse 1.5s infinite}
</style>
</head><body>
<div id="app"></div>
<nav class="nav" id="nav"></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
var currentCustomerId = null;
var selectedMethod = "cash";
var activeSession = null;
var activeRequest = null;
var watchChannels = [];

function go(r,p){ window.location.href = r === "back" ? "index.html" : "payment.html" + (p && p.id ? "?id=" + p.id : ""); }
window.go = go;

function init() {
  var params = new URLSearchParams(window.location.search);
  var sessionId = params.get("id");
  var stored = DB.get("yondu_current_customer", null);
  if (!stored) { document.getElementById("app").innerHTML = '<div class="screen"><div class="wrap"><div class="empty"><div class="big">🔒</div><div class="msg">PLEASE SIGN IN</div><button class="btn" style="margin-top:20px" onclick="location.href=\'index.html\'">Go to App</button></div></div></div>'; return; }
  currentCustomerId = stored;
  loadAll().then(function() {
    if (sessionId) {
      activeSession = getSess(sessionId);
    } else {
      var mine = SESS.filter(function(s){ return s.customerId === currentCustomerId && !s.paid && s.status !== "ended" && s.status !== "cancelled"; });
      activeSession = mine[0];
    }
    var myReqs = REQ.filter(function(r){ return r.customerId === currentCustomerId && r.status === "pending"; });
    activeRequest = myReqs[0];
    render();
    setupWatch();
  }).catch(function(e){ console.error(e); document.getElementById("app").innerHTML = '<div class="screen"><div class="wrap"><div class="empty"><div class="big">❌</div><div class="msg">CONNECTION FAILED</div><button class="btn" style="margin-top:20px" onclick="location.reload()">Retry</button></div></div></div>'; });
}

function render() {
  var app = document.getElementById("app");
  var c = CUST.find(function(x){ return x.id === currentCustomerId; });
  if (!c) { app.innerHTML = '<div class="screen"><div class="wrap"><div class="empty"><div class="msg">CUSTOMER NOT FOUND</div></div></div></div>'; return; }

  if (!activeSession) {
    app.innerHTML = '<div class="screen"><div class="wrap"><div class="brand"><div class="brand-icon"></div><div class="brand-txt"><div class="g">Jay Shree Ganesha</div><div class="n">Yondu Gaming Café</div><div class="s">Pay Bill</div></div></div><div class="empty"><div class="big">✓</div><div class="msg">NO PENDING BILL</div><p style="color:var(--txt3);margin-top:10px;font-size:13px">You have no unpaid sessions right now.</p><button class="btn" style="margin-top:24px" onclick="location.href=\'index.html\'">← Back to App</button></div></div></div>';
    return;
  }

  var s = activeSession;
  var isPending = activeRequest && activeRequest.sessionId === s.id;
  var statusBadge = isPending
    ? '<div class="status-pending"><span class="dot"></span>Waiting for Staff</div>'
    : '<div class="status-live"><span class="dot"></span>Live · Pay Now</div>';

  var pointsBalance = c.points || 0;
  var canUsePoints = pointsBalance >= s.total;

  app.innerHTML = '<div class="screen"><div class="wrap" style="max-width:520px">' +
    '<div class="brand"><div class="brand-icon"></div><div class="brand-txt"><div class="g">Jay Shree Ganesha</div><div class="n">Pay Bill</div><div class="s">' + c.name + ' · ' + c.id + '</div></div></div>' +

    '<div style="margin-bottom:24px">' + statusBadge + '</div>' +

    '<div class="id-card" style="padding:28px 22px">' +
      '<div class="label">AMOUNT DUE</div>' +
      '<div class="idnum" style="font-size:56px;letter-spacing:.02em">₹' + s.total + '</div>' +
      '<div class="hint">' + s.expName + '</div>' +
    '</div>' +

    '<div class="sec-label">Bill Details</div>' +
    '<div class="card">' +
      (s.items || []).map(function(it, i) {
        return '<div class="bill-row"><div class="lbl">' + (i+1) + '. ' + it + '</div><div class="val">—</div></div>';
      }).join("") +
      '<div class="bill-row" style="border-top:1px solid var(--line2);border-bottom:0;padding-top:16px;margin-top:8px"><div class="lbl" style="font-weight:700;color:var(--txt)">Total</div><div class="val" style="color:var(--gold);font-size:20px">₹' + s.total + '</div></div>' +
    '</div>' +

    (isPending ? '' :
      '<div class="sec-label">Payment Method</div>' +
      '<div class="pay-method">' +
        '<button class="pay-btn ' + (selectedMethod === "cash" ? "on" : "") + '" onclick="pickMethod(\'cash\')">' +
          '<div class="ic">💵</div>' +
          '<div class="info"><div class="t">Cash at Counter</div><div class="d">Pay ₹' + s.total + ' in cash · earn ' + Math.floor(s.total / RR) + ' points</div></div>' +
          '<div class="check">✓</div>' +
        '</button>' +
        '<button class="pay-btn ' + (selectedMethod === "upi" ? "on" : "") + '" onclick="pickMethod(\'upi\')">' +
          '<div class="ic">📱</div>' +
          '<div class="info"><div class="t">UPI / Online</div><div class="d">Pay ₹' + s.total + ' via UPI · earn ' + Math.floor(s.total / RR) + ' points</div></div>' +
          '<div class="check">✓</div>' +
        '</button>' +
        '<button class="pay-btn ' + (selectedMethod === "points" ? "on" : "") + '" onclick="pickMethod(\'points\')"' + (canUsePoints ? '' : ' style="opacity:.4;cursor:not-allowed"') + '>' +
          '<div class="ic">🎁</div>' +
          '<div class="info"><div class="t">Use Reward Points</div><div class="d">' + (canUsePoints ? pointsBalance + ' points available · use ' + s.total + ' pts' : 'Need ' + s.total + ' pts · you have ' + pointsBalance) + '</div></div>' +
          '<div class="check">✓</div>' +
        '</button>' +
      '</div>' +
      '<button class="btn" style="margin-top:24px" onclick="submitPayment()">Send to Staff →</button>' +
      '<div class="notice gold" style="margin-top:16px;font-size:12px">📲 Staff will receive your request instantly and confirm at counter.</div>'
    ) +

    (isPending ?
      '<div class="notice orange" style="margin-top:20px">⏳ <b>Request sent.</b> Show this screen to staff. They will confirm your payment shortly.</div>' +
      '<button class="btn danger" style="margin-top:12px" onclick="cancelRequest()">Cancel Request</button>'
    : '') +

    '<button class="btn dark" style="margin-top:12px" onclick="location.href=\'index.html\'">← Back to App</button>' +
  '</div></div>';
}

window.pickMethod = function(m) { selectedMethod = m; render(); };

window.submitPayment = function() {
  if (!activeSession) return;
  if (selectedMethod === "points") {
    var c = CUST.find(function(x){ return x.id === currentCustomerId; });
    if (!c || (c.points || 0) < activeSession.total) return alert("Not enough points");
  }
  var r = {
    id: "RQ" + Date.now().toString(36).toUpperCase().slice(-6),
    type: "payment",
    customerId: currentCustomerId,
    sessionId: activeSession.id,
    customerName: CUST.find(function(x){ return x.id === currentCustomerId; }).name,
    items: activeSession.items || [],
    total: activeSession.total,
    pointsUsed: selectedMethod === "points" ? activeSession.total : 0,
    minutes: 0,
    status: "pending",
    note: "Method: " + selectedMethod.toUpperCase(),
    createdAt: Date.now(),
    processedAt: 0
  };
  sb.from("requests").insert(denormReq(r)).then(function(res) {
    if (res.error) { alert("Error: " + res.error.message); return; }
    REQ = [r].concat(REQ);
    activeRequest = r;
    render();
  });
};

window.cancelRequest = function() {
  if (!activeRequest) return;
  sb.from("requests").update({ status: "cancelled", processed_at: Date.now() }).eq("id", activeRequest.id).then(function() {
    activeRequest.status = "cancelled";
    activeRequest = null;
    render();
  });
};

function setupWatch() {
  watchChannels.forEach(function(ch){ try { sb.removeChannel(ch); } catch(e){} });
  watchChannels = [];
  try {
    var ch = sb.channel("pay-watch-" + currentCustomerId)
      .on("postgres_changes", { event: "*", schema: "public", table: "sessions" }, function(p){ loadAll().then(function(){
        if (activeSession) activeSession = getSess(activeSession.id);
        if (activeSession && activeSession.paid) {
          showSuccess();
          return;
        }
        render();
      }); })
      .on("postgres_changes", { event: "*", schema: "public", table: "requests" }, function(p){ loadAll().then(function(){
        var mine = REQ.filter(function(r){ return r.customerId === currentCustomerId && r.status === "pending" && r.sessionId === activeSession.id; });
        activeRequest = mine[0] || null;
        render();
      }); })
      .on("postgres_changes", { event: "*", schema: "public", table: "customers" }, function(p){ loadAll().then(function(){ render(); }); })
      .subscribe();
    watchChannels.push(ch);
  } catch(e) { console.error(e); }
}

function showSuccess() {
  document.getElementById("app").innerHTML = '<div class="screen"><div class="wrap" style="max-width:520px">' +
    '<div class="brand"><div class="brand-icon"></div><div class="brand-txt"><div class="g">Jay Shree Ganesha</div><div class="n">Payment Complete</div><div class="s">Thank you</div></div></div>' +
    '<div class="id-card" style="padding:44px 24px;text-align:center">' +
      '<div style="font-size:72px;margin-bottom:16px">✅</div>' +
      '<div style="color:var(--gold);font-size:12px;font-weight:700;letter-spacing:.2em;margin-bottom:8px">PAID</div>' +
      '<div style="font-size:48px;font-weight:700;color:var(--gold);letter-spacing:-.03em">₹' + activeSession.total + '</div>' +
      '<div style="color:var(--txt3);font-size:13px;margin-top:14px">Payment confirmed by staff</div>' +
    '</div>' +
    '<div class="notice green" style="margin-top:20px;text-align:center">🎁 <b>+' + activeSession.pointsEarned + ' points</b> added to your account</div>' +
    '<div class="card" style="margin-top:16px"><div class="bill-row"><div class="lbl">Method</div><div class="val">' + (activeSession.method || "").toUpperCase() + '</div></div><div class="bill-row"><div class="lbl">Total Paid</div><div class="val" style="color:var(--gold)">₹' + activeSession.total + '</div></div><div class="bill-row"><div class="lbl">Points Earned</div><div class="val" style="color:var(--green)">+' + (activeSession.pointsEarned || 0) + '</div></div></div>' +
    '<button class="btn" style="margin-top:24px" onclick="location.href=\'index.html\'">Back to Home</button>' +
  '</div></div>';
}

init();
</script>
</body></html>
